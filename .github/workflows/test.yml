name: Tests

# Run on every PR and on every push to main, so reviewers see status before
# merging and main never silently goes red.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a PR cancels the in-flight run for that same branch — saves
# CI minutes when you push a fix-up commit.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }} · Python ${{ matrix.python-version }})
    env:
      RUNSHEET_PILOT_STATS: '0'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.11 = the version the release builds (PyInstaller in release.yml)
        # 3.12, 3.13 = guard against regressions on Pythons newer than the
        # release target, so we notice if a future Homebrew default breaks us.
        # 3.9 was dropped May 2026 — Python 3.9 reached EOL Oct 2025 and a
        # wave of deps (pytest 9, requests 2.34, pdfplumber 0.11) now require
        # 3.10+. 3.10 omitted because it's in security-fix-only mode; if the
        # PyInstaller release target ever moves up to 3.12, drop 3.11 here.
        #
        # WINDOWS, on the release-target Python only. Added after v2.9.0 was
        # blocked by a UnicodeDecodeError that no Linux runner could ever
        # see: Path.read_text() uses the locale codec, cp1252 on Windows, and
        # two sources hold UTF-8. Until this job existed, the entire class of
        # Windows-only bugs (locale codecs, path separators, winocr) was
        # invisible until the release build — which runs last and blocks
        # shipping. One job moves that from "release blocked" to "PR red".
        # Not a full 3x3 matrix: the Python-version risk is the same on both
        # OSes, so pairing Windows with 3.11 buys the coverage for one job.
        include:
          - {os: ubuntu-latest, python-version: "3.11"}
          - {os: ubuntu-latest, python-version: "3.12"}
          - {os: ubuntu-latest, python-version: "3.13"}
          - {os: windows-latest, python-version: "3.11"}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Syntax check (fast fail before pytest)
        # encoding is explicit for the same reason the Windows job exists:
        # open() would use cp1252 there, and one em-dash in this file would
        # break CI on a platform the author never runs.
        run: python -c "import ast, pathlib; ast.parse(pathlib.Path('propresenter_app.py').read_text(encoding='utf-8'))"

      - name: Import smoke test
        # Catches import-time crashes (missing deps, bad globals, etc.) that
        # pytest's collection would otherwise surface as a confusing collection
        # error. Cheap; runs in <1s.
        run: python -c "import propresenter_app; print('imported OK, version', propresenter_app.VERSION)"

      - name: Run pytest
        run: pytest tests/ -v

      - name: Audit dependencies for known CVEs
        # Belt-and-braces with Dependabot — different vulnerability DB
        # (PyPI Advisory DB + OSV), catches some things Dependabot misses
        # and vice versa. Fails the build on any unfixed vuln in our
        # actual dependency tree. Only runs on Python 3.11 to save time
        # (the audit result is identical across versions).
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --strict
          pip-audit -r requirements-dev.txt --strict
