name: Tests

# Run on every PR and on every push to main, so reviewers see status before
# merging and main never silently goes red.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a PR cancels the in-flight run for that same branch — saves
# CI minutes when you push a fix-up commit.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 = the version the release builds (PyInstaller in release.yml)
        # 3.12, 3.13 = guard against regressions on Pythons newer than the
        # release target, so we notice if a future Homebrew default breaks us.
        # 3.9 was dropped May 2026 — Python 3.9 reached EOL Oct 2025 and a
        # wave of deps (pytest 9, requests 2.34, pdfplumber 0.11) now require
        # 3.10+. 3.10 omitted because it's in security-fix-only mode; if the
        # PyInstaller release target ever moves up to 3.12, drop 3.11 here.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Syntax check (fast fail before pytest)
        run: python -c "import ast; ast.parse(open('propresenter_app.py').read())"

      - name: Import smoke test
        # Catches import-time crashes (missing deps, bad globals, etc.) that
        # pytest's collection would otherwise surface as a confusing collection
        # error. Cheap; runs in <1s.
        run: python -c "import propresenter_app; print('imported OK, version', propresenter_app.VERSION)"

      - name: Run pytest
        run: pytest tests/ -v

      - name: Audit dependencies for known CVEs
        # Belt-and-braces with Dependabot — different vulnerability DB
        # (PyPI Advisory DB + OSV), catches some things Dependabot misses
        # and vice versa. Fails the build on any unfixed vuln in our
        # actual dependency tree. Only runs on Python 3.11 to save time
        # (the audit result is identical across versions).
        if: matrix.python-version == '3.11'
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --strict
          pip-audit -r requirements-dev.txt --strict
