name: Release

# Two ways to trigger this workflow:
#
# 1. **Tag push** — `git tag v2.1.0 && git push --tags`.
#    Builds Win + Mac, smoke-tests both, publishes a GitHub Release with
#    .exe + .dmg attached. This is what end users download from the
#    Releases page — no Python required on their machine.
#
# 2. **Manual dispatch** — Actions tab → "Release" → "Run workflow" →
#    pick any branch (usually main). Builds Win + Mac and smoke-tests
#    them exactly the same way, but does NOT publish a Release. The
#    .exe and .dmg are uploaded as workflow artifacts instead — download
#    from the run's summary page within 7 days. Use this when you want a
#    test build for personal use, a friend's QA pass, or to verify the
#    pipeline still works without burning a real version number.
#
# What never runs this workflow: opening a PR, pushing to a branch, or
# merging to main. Releases are an explicit, deliberate action.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write   # for softprops/action-gh-release to create the Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─── Windows .exe ──────────────────────────────────────────────────────
  # BLOCKING. The smoke test (launch → poll /api/health → quit) now passes
  # reliably: the long-standing red X was never a bundle bug — the exe
  # served fine, but the CI probe (Invoke-WebRequest) was routing localhost
  # through the runner's HTTP proxy and hanging. Fixed by probing 127.0.0.1
  # with -NoProxy. Since the exe is the production target on real Windows
  # machines, a failure here now blocks the whole release — no shipping a
  # Windows binary that can't answer /api/health.
  #
  # To temporarily park it again (only if CI genuinely breaks): add
  # `continue-on-error: true` back here AND restore the release job's
  # `if: always() && needs.build-mac.result == 'success'` gate.
  build-windows:
    name: Build Windows .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests (gate)
        # Same suite that test.yml runs — re-run here as a final safety net
        # before producing a binary the public will download.
        run: pytest tests/ -v

      - name: Build .exe with PyInstaller
        # Inline command instead of calling build_win.bat — that script does
        # venv creation + cleanup we don't need on a fresh runner. Flags must
        # stay in sync with build_win.bat if you change one, change both.
        run: |
          pyinstaller `
            --name "Runsheet Pilot" `
            --windowed --onefile --noconfirm --clean `
            --collect-submodules pdfplumber `
            --collect-submodules waitress `
            --collect-submodules cryptography `
            --hidden-import waitress `
            --hidden-import flask `
            --hidden-import pdfplumber `
            --hidden-import tkinter `
            --collect-all webview `
            --collect-all clr_loader `
            --collect-all pythonnet `
            --icon assets\icon.ico `
            --add-data "templates;templates" `
            --add-data "static;static" `
            propresenter_app.py

      - name: Stable-named exe for the self-updater
        # The in-app updater fetches assets by exact, versionless name so
        # old installs can always find newer releases.
        shell: pwsh
        run: Copy-Item "dist\Runsheet Pilot.exe" "dist\Runsheet-Pilot-windows.exe"

      # Upload BEFORE the smoke test so the artifact exists regardless of
      # smoke-test outcome. The smoke test below is now a real, passing
      # gate (see the job header) — if it fails, the whole release is
      # blocked — but keeping the upload first is harmless and means the
      # exe is available in the run's artifacts even for a failed run,
      # which helps debugging.
      - uses: actions/upload-artifact@v7
        with:
          name: windows-exe
          path: |
            dist/Runsheet Pilot.exe
            dist/Runsheet-Pilot-windows.exe
          if-no-files-found: error
          retention-days: 7

      - name: Smoke-test the .exe
        # Launches the built .exe with --headless (suppresses the tkinter
        # status window — the GitHub Windows runner has no interactive
        # desktop session, so Tk would hang/crash; real users on real
        # desktops won't pass --headless and will see the window
        # normally). Polls /api/health for up to 60 s, then POSTs
        # /api/quit. Fails if the binary can't even answer "ok": catches
        # missing PyInstaller imports, broken template paths, syntax
        # errors, and other "the binary doesn't actually run"
        # regressions that pytest cannot see.
        #
        # Captures the .exe's stdout/stderr to file AND dumps the app's
        # own log file from %APPDATA% on failure — without this, a
        # silent crash in the bundle leaves us guessing.
        shell: pwsh
        run: |
          $exe = "dist\Runsheet Pilot.exe"
          if (-not (Test-Path $exe)) { throw "Build did not produce $exe" }

          # Clear any prior app.log so the failure dump below shows ONLY this
          # exe's own startup output. (The test suite no longer writes here —
          # it isolates via RUNSHEET_PILOT_DATA_DIR — but a previous smoke run
          # on the same runner could still have left lines behind.)
          $appLog = Join-Path $env:APPDATA "Runsheet Pilot\app.log"
          Remove-Item $appLog -ErrorAction SilentlyContinue

          $stdoutFile = "$env:RUNNER_TEMP\app-stdout.log"
          $stderrFile = "$env:RUNNER_TEMP\app-stderr.log"
          $proc = Start-Process -FilePath $exe -ArgumentList "--headless" `
                                -RedirectStandardOutput $stdoutFile `
                                -RedirectStandardError $stderrFile `
                                -PassThru

          $deadline = (Get-Date).AddSeconds(60)
          $ok = $false
          while ((Get-Date) -lt $deadline) {
            if ($proc.HasExited) {
              Write-Host "PROCESS EXITED EARLY with code $($proc.ExitCode)"
              break
            }
            try {
              # 127.0.0.1 (not localhost) matches exactly where waitress
              # binds — avoids localhost->::1 IPv6 resolution. -NoProxy is
              # the key fix: CI runners can route even localhost through an
              # HTTP proxy; browsers auto-bypass proxy for localhost but
              # Invoke-WebRequest does NOT, which is why a browser reached
              # the exe (served /api/library/auto in the logs) while this
              # probe timed out. Diagnosed from a clean frozen-exe run.
              $r = Invoke-WebRequest -Uri http://127.0.0.1:5757/api/health `
                                     -TimeoutSec 2 -UseBasicParsing -NoProxy
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
            Start-Sleep -Seconds 1
          }

          if (-not $ok) {
            Write-Host ""
            Write-Host "=== FINAL PROBE (real status, does not throw) ==="
            # -SkipHttpErrorCheck returns the response instead of throwing on
            # 4xx/5xx, so we can tell a *wrong status* (404/500 = routes not
            # registered / app error) apart from *no response at all*
            # (connection refused / hang). This is the decisive signal the
            # old try/catch{} swallowed.
            foreach ($path in @("/api/health", "/")) {
              try {
                $resp = Invoke-WebRequest -Uri "http://127.0.0.1:5757$path" `
                          -TimeoutSec 4 -UseBasicParsing -SkipHttpErrorCheck -NoProxy
                $body = if ($resp.Content) { $resp.Content.Substring(0, [Math]::Min(200, $resp.Content.Length)) } else { "" }
                Write-Host "  $path -> HTTP $($resp.StatusCode)  body: $body"
              } catch {
                Write-Host "  $path -> NO RESPONSE ($($_.Exception.Message))"
              }
            }
            Write-Host ""
            Write-Host "=== PROCESS STATE ==="
            if ($proc.HasExited) {
              Write-Host "ExitCode: $($proc.ExitCode)"
            } else {
              Write-Host "Still running, PID=$($proc.Id)"
              try { Stop-Process -Id $proc.Id -Force } catch {}
            }
            Write-Host ""
            Write-Host "=== .exe stdout ($stdoutFile) ==="
            if (Test-Path $stdoutFile) { Get-Content $stdoutFile }
              else { Write-Host "(file not created)" }
            Write-Host ""
            Write-Host "=== .exe stderr ($stderrFile) ==="
            if (Test-Path $stderrFile) { Get-Content $stderrFile }
              else { Write-Host "(file not created)" }
            Write-Host ""
            Write-Host "=== app.log from %APPDATA% ==="
            $appLog = Join-Path $env:APPDATA "Runsheet Pilot\app.log"
            if (Test-Path $appLog) { Get-Content $appLog -Tail 80 }
              else { Write-Host "(no app.log written — app likely died before logging_setup ran)" }
            Write-Host ""
            Write-Host "=== port 5757 status ==="
            try { Get-NetTCPConnection -LocalPort 5757 -ErrorAction Stop | Format-Table }
              catch { Write-Host "port 5757 not bound" }
            throw "Smoke test: /api/health did not respond in 60 s"
          }

          Write-Host "Smoke test passed."
          try {
            Invoke-WebRequest -Uri http://127.0.0.1:5757/api/quit `
                              -Method POST -TimeoutSec 5 -UseBasicParsing -NoProxy | Out-Null
          } catch {}

      - name: Probe the webview backend inside the .exe
        # The classic pywebview packaging failure on Windows is a bundle
        # that builds clean but dies at runtime ("Failed to resolve
        # Python.Runtime" — pythonnet/clr didn't make it into the exe).
        # --probe-webview imports pywebview + the EdgeChromium backend
        # inside the frozen bundle — no window, no display needed — and
        # exits nonzero if anything is missing. Catches it on the runner
        # instead of on an operator's machine.
        shell: pwsh
        run: |
          # The exe is a GUI-subsystem binary: `&` would return IMMEDIATELY
          # with a stale $LASTEXITCODE (the v2.4.0 gate failed on exactly
          # that race while the probe itself was succeeding four seconds
          # later). Start-Process -Wait blocks until a GUI process really
          # exits and reports its true exit code.
          $env:RUNSHEET_PILOT_PROBE_OUT = "$env:RUNNER_TEMP\probe.txt"
          $p = Start-Process -FilePath "dist\Runsheet Pilot.exe" `
                             -ArgumentList "--probe-webview" -PassThru -Wait
          if (Test-Path $env:RUNSHEET_PILOT_PROBE_OUT) {
            Get-Content $env:RUNSHEET_PILOT_PROBE_OUT
          } else {
            Write-Host "(probe wrote no output file)"
          }
          if ($p.ExitCode -ne 0) { throw "webview backend missing from the exe (exit $($p.ExitCode))" }

  # ─── Mac .dmg ──────────────────────────────────────────────────────────
  build-mac:
    name: Build macOS .dmg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests (gate)
        run: pytest tests/ -v

      - name: Build .app + .dmg
        # build_mac.sh creates its own venv + does git-state checks we don't
        # need on a fresh runner. Inline the PyInstaller + hdiutil calls
        # instead — flags must stay in sync with build_mac.sh.
        run: |
          VERSION=$(grep -E '^VERSION\s*=' propresenterrunsheet/config.py \
                    | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          APP_NAME="Runsheet Pilot"
          APP_BUNDLE="${APP_NAME}.app"
          # Stable, versionless name so the README can link to a permanent
          # download URL (/releases/latest/download/Runsheet-Pilot-mac.dmg)
          # that always points at the newest release. The version is still
          # visible in the release title/tag.
          DMG_NAME="Runsheet-Pilot-mac.dmg"

          pyinstaller \
            --name "${APP_NAME}" \
            --windowed --onedir --noconfirm --clean \
            --osx-bundle-identifier "org.church.runsheetPilot" \
            --collect-submodules pdfplumber \
            --collect-submodules waitress \
            --collect-submodules cryptography \
            --hidden-import waitress \
            --hidden-import flask \
            --hidden-import pdfplumber \
            --hidden-import tkinter \
            --collect-all webview \
            --icon assets/icon.icns \
            --add-data "templates:templates" \
            --add-data "assets:assets" \
            --add-data "static:static" \
            propresenter_app.py

          test -d "dist/${APP_BUNDLE}" || { echo "Build missing"; exit 1; }

          DMG_STAGE="dist/dmg_stage"
          mkdir -p "$DMG_STAGE"
          cp -R "dist/${APP_BUNDLE}" "$DMG_STAGE/"
          ln -s /Applications "$DMG_STAGE/Applications"
          hdiutil create -volname "${APP_NAME}" -srcfolder "$DMG_STAGE" \
                         -ov -format UDZO "dist/${DMG_NAME}" >/dev/null
          rm -rf "$DMG_STAGE"

      - name: Zip .app for the self-updater
        # ditto preserves executable bits + symlinks that a plain `zip`
        # (and Python's zipfile) can mangle; the in-app updater extracts
        # with `ditto -x -k` for the same reason.
        run: ditto -c -k --keepParent "dist/Runsheet Pilot.app" "dist/Runsheet-Pilot-mac.zip"

      - name: Smoke-test the .app
        # `open` the .app with --headless (suppresses the tkinter status
        # window — see release.yml's Windows smoke test for the same
        # reasoning). Polls /api/health, then POSTs /api/quit. Mac
        # PyInstaller bundles have historically had issues resolving the
        # shipped --add-data paths (the _MEIPASS resolution); this
        # catches those before users do.
        run: |
          open "dist/Runsheet Pilot.app" --args --headless
          ok=false
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:5757/api/health >/dev/null 2>&1; then
              ok=true
              break
            fi
            sleep 1
          done
          if [ "$ok" != "true" ]; then
            echo "Smoke test: /api/health did not respond in 30 s"
            exit 1
          fi
          echo "Smoke test passed."
          curl -s -X POST http://localhost:5757/api/quit >/dev/null || true

      - name: Probe the webview backend inside the .app
        # Same rationale as the Windows probe: import pywebview + the
        # Cocoa backend inside the frozen bundle without opening a window.
        run: |
          "dist/Runsheet Pilot.app/Contents/MacOS/Runsheet Pilot" --probe-webview

      - uses: actions/upload-artifact@v7
        with:
          name: mac-dmg
          path: |
            dist/Runsheet-Pilot-*.dmg
            dist/Runsheet-Pilot-mac.zip
          if-no-files-found: error
          retention-days: 7

  # ─── Publish GitHub Release ────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    # Both builds must succeed before we publish — standard `needs` gating
    # (no always()), so a Windows OR Mac failure blocks the release. That's
    # the point of Windows being blocking now: we never ship a release
    # missing a verified binary.
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    # Only publish on an actual tag push — workflow_dispatch runs build +
    # smoke-test the binaries but upload them as run artifacts only, so
    # test builds don't clutter the Releases page or risk a stale version.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7   # for the generated-release-notes ref

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: ls -laR artifacts

      - name: Generate SHA256SUMS over stable assets
        # Both builds now block the release, so both stable assets
        # (Runsheet-Pilot-mac.zip + Runsheet-Pilot-windows.exe) are always
        # present here — the updater verifies downloads against these sums.
        run: |
          mkdir -p stable
          find artifacts -type f -name 'Runsheet-Pilot-*' ! -name '*.dmg' -exec cp {} stable/ \;
          cd stable
          ls -la
          sha256sum Runsheet-Pilot-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          # `**` matches zero or more path segments, covering BOTH layouts
          # download-artifact@v8 produces: per-artifact subfolders when
          # several artifacts exist, but a FLATTENED root when only one
          # does (e.g. the Windows build failed). v2.3.0's first build
          # lost its .dmg to exactly that flattening.
          # One clean file per platform: Runsheet-Pilot-mac.dmg (human
          # install), Runsheet-Pilot-mac.zip (Mac updater payload),
          # Runsheet-Pilot-windows.exe (Windows install + updater), plus
          # SHA256SUMS.txt. The old space-named "Runsheet Pilot.exe" is
          # deliberately NOT published — it was a confusing duplicate of
          # the stable-named exe.
          files: |
            artifacts/**/*.dmg
            stable/Runsheet-Pilot-*
            stable/SHA256SUMS.txt
          generate_release_notes: true
          # Both builds block the release now, so every listed asset is
          # guaranteed present — fail loudly if a glob matches nothing
          # (catches a rename/path regression before a broken Release ships).
          fail_on_unmatched_files: true
          # Pre-release on any tag with -alpha / -beta / -rc; clean
          # semver tags become full releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
